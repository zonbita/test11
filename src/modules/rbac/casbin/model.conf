# RBAC with domains (domain = company) + data scope.
#
# r.sub   = "user:<id>"
# r.dom   = "company:<id>", or "*" when no company is selected
# r.obj   = resource, e.g. "customer"
# r.act   = action, e.g. "read"
# r.scope = OWN | COMPANY | TENANT  (the guard asks from widest to narrowest and keeps the first allowed)
#
# p = role, resource, action, scope        e.g. role:<id>, customer, read, OWN
# g = user, role, domain                   domain "*" = membership valid in every company of the tenant
#
# A membership bound to ONE company can never yield TENANT scope, whatever the role grants:
# otherwise a company-level user could act tenant-wide (create users/roles) by sending that company id.
# No wildcards: every permission is granted explicitly.

[request_definition]
r = sub, dom, obj, act, scope

[policy_definition]
p = sub, obj, act, scope

[role_definition]
g = _, _, _

[policy_effect]
e = some(where (p.eft == allow))

[matchers]
m = ((g(r.sub, p.sub, r.dom) && r.scope != "TENANT") || g(r.sub, p.sub, "*")) && p.obj == r.obj && p.act == r.act && scopeCovers(p.scope, r.scope)
