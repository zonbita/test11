# Local development: `docker compose up -d` starts PostgreSQL only (run the API with `npm run start:dev`).
# Full stack in containers: `docker compose --profile app up -d --build`.
services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: compte_control
    ports:
      - '5432:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres']
      interval: 5s
      timeout: 3s
      retries: 10

  # One-off job, idempotent: control migrations -> seed (plans, default Super Admin, default tenant "dfm"
  # on a brand-new platform) -> tenant migrations + missing default accounts. Then the API starts.
  migrate:
    profiles: [app]
    build: .
    env_file: .env
    environment: &container-env
      NODE_ENV: production
      LOG_PRETTY: 'false'
      CONTROL_DATABASE_URL: postgresql://postgres:postgres@postgres:5432/compte_control
      TENANT_DB_ADMIN_URL: postgresql://postgres:postgres@postgres:5432/postgres
      TENANT_DB_HOST: postgres
    command:
      - sh
      - -c
      - npx prisma migrate deploy --config prisma.control.config.ts && node dist/cli/seed-control.js && node dist/cli/migrate-tenants.js
    depends_on:
      postgres:
        condition: service_healthy

  app:
    profiles: [app]
    build: .
    env_file: .env
    environment: *container-env
    ports:
      - '3000:3000'
    depends_on:
      migrate:
        condition: service_completed_successfully
    stop_grace_period: 30s

volumes:
  pgdata:
